[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-agent"
version = "0.1.0"
description = "AI Operations Agent — AI-powered DevOps / SRE assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hermes", email = "hermes@example.com" }]
keywords = ["devops", "sre", "ai", "agent", "ssh", "automation"]

dependencies = [
    "asyncssh>=2.14",
    "pydantic>=2.5",
    "rich>=13.0",
    "click>=8.1",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
]
telegram = [
    "aiohttp>=3.9",
]

[project.scripts]
aiops = "aiops_agent.cli.main:main"
aiops-bot = "aiops_agent.cli.main:bot"

[tool.setuptools.packages.find]
where = ["."]
include = ["aiops_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]